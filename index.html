  .leaf::after{

      <p class="byline">A retrospective account, drawn from IMF and World Bank archives and contemporary press coverage.</p>

      <figure class="photo-placeholder hero-photo photo-gallery" data-gallery="page-1" tabindex="0" role="button" aria-label="Photo gallery, click to see the next image">
        <img class="gallery-img" alt="" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="5" width="20" height="15" rx="1.5"/><circle cx="9" cy="12" r="3"/><path d="M2 17l5-4 3 2 4-5 7 7"/></svg>

        <span class="ph-sub">click to cycle</span>
        <span class="photo-index mono">1/3</span>
        <div class="photo-caption-overlay"><span class="pco-text"></span></div>
      </figure>
      <p class="gallery-caption-fallback"></p>

      <div class="cols">
        <p>By the late 1980s, Thailand had committed to hosting the 1991 Annual Meetings of the IMF and World Bank. A Memorandum of Understanding had already been signed by 1987, and preparations were underway for one of the largest international gatherings ever held in the country.</p>
        <p>The commitment came with a significant challenge. Thailand did not yet have an international-standard convention center capable of accommodating the scale of the Annual Meetings. At the same time, rapid economic growth had increased demand for a permanent venue for major conferences, exhibitions, and international events. The government therefore approved the construction of a new national convention center on a site adjacent to land long used by the Tobacco Monopoly, beginning a race to complete the project before delegates arrived in October 1991.</p>
        <p>Four stories inside trace how that commitment was carried through &mdash; the convention center that rose beside the Tobacco Monopoly&rsquo;s grounds, the communities surrounding the project, the logistical effort required to move thousands of visitors across Bangkok, and the opening of the Meetings themselves.</p>

        <p>ภายในช่วงปลายทศวรรษ 1980 ประเทศไทยได้ตอบรับการเป็นเจ้าภาพจัดการประชุมประจำปี พ.ศ. 2534 ของ IMF และธนาคารโลกแล้ว โดยมีการลงนามบันทึกความเข้าใจตั้งแต่ปี พ.ศ. 2530 และเริ่มดำเนินการเตรียมงานสำหรับการประชุมระหว่างประเทศครั้งใหญ่ที่สุดครั้งหนึ่งเท่าที่ประเทศไทยเคยจัดขึ้น</p>
        <p>ภารกิจครั้งนี้มาพร้อมความท้าทายครั้งสำคัญ ในเวลานั้นประเทศไทยยังไม่มีศูนย์ประชุมมาตรฐานสากลที่สามารถรองรับการประชุมขนาดดังกล่าวได้ ขณะเดียวกัน การเติบโตทางเศรษฐกิจอย่างรวดเร็วยังทำให้เกิดความต้องการสถานที่ถาวรสำหรับการประชุม การแสดงสินค้า และกิจกรรมระหว่างประเทศ รัฐบาลจึงอนุมัติการก่อสร้างศูนย์การประชุมแห่งชาติบนพื้นที่ที่อยู่ติดกับที่ดินของโรงงานยาสูบ และเริ่มต้นการแข่งขันกับเวลาเพื่อสร้างโครงการนี้ให้เสร็จก่อนการเดินทางมาถึงของผู้แทนทั่วโลกในเดือนตุลาคม พ.ศ. 2534</p>
        <p>เรื่องราวทั้งสี่ตอนในฉบับนี้จะพาย้อนกลับไปสำรวจว่าภารกิจดังกล่าวเกิดขึ้นได้อย่างไร ตั้งแต่การก่อสร้างศูนย์การประชุมบนพื้นที่ติดกับโรงงานยาสูบ ชุมชนโดยรอบโครงการ ความท้าทายด้านการคมนาคมเพื่อรองรับผู้เข้าร่วมงานนับพันคน ไปจนถึงวันเปิดการประชุม</p>

  <h2 class="front-headline">A Convention Center Rises</h2>
  <p class="byline">Where there had been open land, a hall climbed skyward in under two years.</p>

  <div class="cols">
    <span class="stamp" style="--rot:-6deg;">Completed</span>
    <p>As preparations for the 1991 Annual Meetings advanced, the Thai government approved the construction of a national convention center on a site adjacent to land long used by the Tobacco Monopoly. Ground broke on November&nbsp;1, 1989, on what was conceived as Thailand&rsquo;s first national convention center &mdash; a facility that would serve as the venue for the Meetings and as a permanent national convention and exhibition center.</p>
    <p>Construction ran for nearly two years, and the building was completed on August&nbsp;29, 1991. Contemporary press reports of the cost varied, from roughly $90&nbsp;million to $100&nbsp;million. That left just under seven weeks before the Annual Meetings opened on October&nbsp;15.</p>
    <div class="figure-box"><span class="fig-num mono">$90&ndash;100M</span><span class="fig-label">Reported construction cost (sources vary), for a building with no domestic precedent</span></div>
    <p>The center would go on to serve as one of Bangkok&rsquo;s primary exhibition and meeting venues for decades afterward &mdash; a legacy of infrastructure built to a deadline that could not move.</p>

  <div class="cols">
    <span class="stamp" style="--rot:5deg;">State Land</span>
    <p>The Queen Sirikit National Convention Center stands at 60 New Ratchadapisek Road, in Bangkok&rsquo;s Khlong Toei district &mdash; itself a newly created administrative district that November of 1989, split off from neighboring Phra Khanong the same month construction on the hall began. The site borders land long occupied by the Tobacco Monopoly of Thailand, whose factory compound had operated there since 1950.</p>
    <p>That plot had a specific history: it was a disused pond the Tobacco Monopoly had once used to dispose of old tobacco leaves, sitting on roughly 53&nbsp;rai (about 8.6&nbsp;hectares) of land the state already owned. Building on land the government already controlled meant construction could begin without a separate acquisition &mdash; a real advantage given Thailand had well under two years to deliver a national convention center from a standing start.</p>
    <p>In the late 1980s, Khlong Toei was a working port-and-industrial district, anchored by Bangkok Port (opened 1938) and the Tobacco Monopoly&rsquo;s factory grounds &mdash; not yet the hotel-and-business corridor that grew up around the finished convention center in the years that followed.</p>
    <p>That construction was not without cost to its immediate neighbors: the families living in informal settlements opposite the site were relocated ahead of the meetings, and remaining structures within view of the venue were screened behind painted corrugated metal. Part of the adjoining Tobacco Monopoly land later became Benjakitti Park, opened in 2004.</p>
    <p class="page-sources mono">Sources: <a href="https://www.washingtonpost.com/archive/politics/1991/10/16/imf-conference-brings-10000-to-bangkok/8320c2ee-8ca0-463f-8588-99506fb7f493/" target="_blank" rel="noopener">The Washington Post, Oct. 16, 1991</a> &middot; <a href="https://en.wikipedia.org/wiki/Queen_Sirikit_National_Convention_Center" target="_blank" rel="noopener">Queen Sirikit National Convention Center</a> &middot; <a href="https://en.wikipedia.org/wiki/Klongtoey_District" target="_blank" rel="noopener">Khlong Toei District</a> &middot; <a href="https://thaipublica.org/2026/05/imf-world-bank-annual-meeting-2026-2/" target="_blank" rel="noopener">ThaiPublica, 1991 meetings retrospective</a> &middot; <a href="https://en.wikipedia.org/wiki/Benjakitti_Park" target="_blank" rel="noopener">Benjakitti Park</a> &middot; Bank of Thailand archives</p>
  </div>

<template id="tpl-page-3-th">
  <div class="runninghead"><span>สารการประชุมสภาผู้ว่าการ &middot; หน้า A3 &middot; ผังเมือง</span><span>ย้อนรำลึกตุลาคม 2534</span></div>
  <div class="torn"></div>
  <span class="kicker">การวางผังเมือง</span>
  <h2 class="front-headline">ผืนดินที่ใช้ก่อสร้างหอประชุม</h2>
  <p class="byline">เหตุผลที่หอประชุมตั้งอยู่ในย่านคลองเตย และสิ่งที่เคยอยู่บนผืนดินแห่งนี้มาก่อน</p>

  <figure class="photo-placeholder page-photo photo-gallery" data-gallery="page-3" tabindex="0" role="button" aria-label="แกลเลอรีภาพ คลิกเพื่อดูภาพถัดไป">
    <img class="gallery-img" alt="" />
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
    <span class="ph-label">ใส่รูปภาพที่นี่</span>
    <span class="ph-sub">คลิกเพื่อดูภาพถัดไป</span>
    <span class="photo-index mono">1/1</span>
    <div class="photo-caption-overlay"><span class="pco-text"></span></div>
  </figure>
  <p class="gallery-caption-fallback"></p>

  <div class="cols">
    <span class="stamp" style="--rot:5deg;">ที่ดินรัฐ</span>
    <p>ศูนย์การประชุมแห่งชาติสิริกิติ์ตั้งอยู่เลขที่ 60 ถนนรัชดาภิเษกตัดใหม่ ในเขตคลองเตยของกรุงเทพฯ ซึ่งเพิ่งได้รับการจัดตั้งเป็นเขตปกครองใหม่เมื่อเดือนพฤศจิกายน พ.ศ. 2532 โดยแยกออกมาจากเขตพระโขนงในเดือนเดียวกับที่เริ่มก่อสร้างหอประชุมพอดี พื้นที่ดังกล่าวมีอาณาเขตติดกับที่ดินของการยาสูบแห่งประเทศไทย ซึ่งโรงงานผลิตบุหรี่เปิดดำเนินการอยู่บนที่ดินผืนนี้มาตั้งแต่ พ.ศ. 2493</p>
    <p>ที่ดินผืนนี้เคยเป็นบ่อทิ้งใบยาเก่าที่การยาสูบแห่งประเทศไทยใช้งานมาก่อน ตั้งอยู่บนเนื้อที่ประมาณ 53 ไร่ (ราว 8.6 เฮกตาร์) ซึ่งเป็นที่ดินของรัฐอยู่แล้ว การก่อสร้างบนที่ดินที่รัฐบาลถือครองอยู่แล้วทำให้ไม่ต้องเสียเวลาจัดหาที่ดินใหม่ นับเป็นข้อได้เปรียบสำคัญ เนื่องจากประเทศไทยมีเวลาไม่ถึงสองปีในการสร้างศูนย์การประชุมแห่งชาติขึ้นจากศูนย์</p>
    <p>ในช่วงปลายทศวรรษ 1980 คลองเตยยังเป็นย่านท่าเรือและอุตสาหกรรม มีท่าเรือกรุงเทพ (เปิดใช้งานเมื่อ พ.ศ. 2481) และที่ดินโรงงานของการยาสูบแห่งประเทศไทยเป็นศูนย์กลาง ยังไม่ใช่ย่านโรงแรมและธุรกิจอย่างที่ก่อตัวขึ้นรอบศูนย์การประชุมในเวลาต่อมา</p>
    <p>การก่อสร้างครั้งนี้ไม่ได้ปราศจากผลกระทบต่อชุมชนใกล้เคียง ครอบครัวที่อาศัยอยู่ในชุมชนแออัดตรงข้ามพื้นที่ก่อสร้างถูกย้ายออกก่อนการประชุมจะเริ่มขึ้น ส่วนบ้านเรือนที่ยังคงอยู่ในสายตาของผู้ที่มาร่วมงานก็ถูกกั้นด้วยแผ่นเหล็กลูกฟูกที่ทาสีไว้ ที่ดินส่วนหนึ่งของการยาสูบแห่งประเทศไทยที่อยู่ติดกันภายหลังกลายเป็นสวนเบญจกิติ ซึ่งเปิดใช้งานใน พ.ศ. 2547</p>
    <p class="page-sources mono">แหล่งข้อมูล: <a href="https://www.washingtonpost.com/archive/politics/1991/10/16/imf-conference-brings-10000-to-bangkok/8320c2ee-8ca0-463f-8588-99506fb7f493/" target="_blank" rel="noopener">The Washington Post, Oct. 16, 1991</a> &middot; <a href="https://en.wikipedia.org/wiki/Queen_Sirikit_National_Convention_Center" target="_blank" rel="noopener">Queen Sirikit National Convention Center</a> &middot; <a href="https://en.wikipedia.org/wiki/Klongtoey_District" target="_blank" rel="noopener">Khlong Toei District</a> &middot; <a href="https://thaipublica.org/2026/05/imf-world-bank-annual-meeting-2026-2/" target="_blank" rel="noopener">ThaiPublica (บทความย้อนอดีตการประชุม พ.ศ. 2534)</a> &middot; <a href="https://en.wikipedia.org/wiki/Benjakitti_Park" target="_blank" rel="noopener">Benjakitti Park</a> &middot; เอกสารจดหมายเหตุของธนาคารแห่งประเทศไทย</p>
  </div>

  <h2 class="front-headline">Clearing the Roads</h2>
  <p class="byline">Bangkok&rsquo;s traffic was already notorious by 1991.</p>

  <figure class="photo-placeholder page-photo photo-gallery" data-gallery="page-4" tabindex="0" role="button" aria-label="Photo gallery, click to see the next image">
    <img class="gallery-img" alt="" />

    <div class="photo-caption-overlay"><span class="pco-text"></span></div>
  </figure>
  <p class="gallery-caption-fallback"></p>

  <div class="cols">
    <span class="stamp" style="--rot:-4deg;">Holiday Declared</span>
    <p>Bangkok&rsquo;s chronic congestion concerned organizers nearly as much as the convention center itself. With thousands of delegates, journalists and support staff needing to move between hotels, the venue and the airport on tight schedules, the interim government &mdash; installed by the military after the February&nbsp;1991 coup and led by Anand Panyarachun &mdash; declared two public holidays during the meetings to help keep the roads clear.</p>
    <div class="figure-box"><span class="fig-num mono">2</span><span class="fig-label">Public holidays declared for traffic relief during the meetings</span></div>
    <p>It was a temporary fix for a problem city planners had wrestled with for years &mdash; and a fitting coda to years of preparation: the last mile solved not with concrete, but with a decree.</p>
    <p class="page-sources mono">Sources: <a href="https://www.washingtonpost.com/archive/politics/1991/10/16/imf-conference-brings-10000-to-bangkok/8320c2ee-8ca0-463f-8588-99506fb7f493/" target="_blank" rel="noopener">The Washington Post, Oct. 16, 1991</a> &middot; <a href="https://www.csmonitor.com/1991/1008/08081.html" target="_blank" rel="noopener">The Christian Science Monitor, Oct. 8, 1991</a> &middot; Bank of Thailand archives</p>

  <div class="cols">
    <span class="stamp" style="--rot:-4deg;">ประกาศวันหยุด</span>
    <p>ปัญหาการจราจรติดขัดเรื้อรังของกรุงเทพฯ เป็นความกังวลของผู้จัดงานไม่แพ้ตัวศูนย์การประชุมเอง เมื่อผู้แทน นักข่าว และเจ้าหน้าที่สนับสนุนนับพันคนต้องเดินทางระหว่างโรงแรม สถานที่จัดงาน และสนามบินภายในตารางเวลาที่รัดกุม รัฐบาลรักษาการ ซึ่งตั้งขึ้นโดยฝ่ายทหารหลังการรัฐประหารในเดือนกุมภาพันธ์ พ.ศ. 2534 และมีนายอานันท์ ปันยารชุน เป็นนายกรัฐมนตรี จึงประกาศวันหยุดราชการสองวันระหว่างการประชุมเพื่อช่วยให้ถนนโล่ง</p>
    <div class="figure-box"><span class="fig-num mono">2</span><span class="fig-label">วันหยุดราชการที่ประกาศเพื่อคลี่คลายการจราจรระหว่างการประชุม</span></div>
    <p>มันเป็นทางแก้ปัญหาชั่วคราวสำหรับปัญหาที่นักผังเมืองต้องรับมือมานานหลายปี และเป็นบทสรุปที่เหมาะสมของการเตรียมงานที่ยาวนาน ระยะทางสุดท้ายไม่ได้ถูกแก้ด้วยคอนกรีต แต่ด้วยคำสั่งประกาศ</p>
    <p class="page-sources mono">แหล่งข้อมูล: <a href="https://www.washingtonpost.com/archive/politics/1991/10/16/imf-conference-brings-10000-to-bangkok/8320c2ee-8ca0-463f-8588-99506fb7f493/" target="_blank" rel="noopener">The Washington Post, Oct. 16, 1991</a> &middot; <a href="https://www.csmonitor.com/1991/1008/08081.html" target="_blank" rel="noopener">The Christian Science Monitor, Oct. 8, 1991</a> &middot; เอกสารจดหมายเหตุของธนาคารแห่งประเทศไทย</p>

  <h2 class="front-headline">Ten Thousand Guests</h2>
  <p class="byline">The doors opened on October&nbsp;15, 1991.</p>

  <figure class="photo-placeholder page-photo photo-gallery" data-gallery="page-5" tabindex="0" role="button" aria-label="Photo gallery, click to see the next image">
    <img class="gallery-img" alt="" />
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/></svg>

    <span class="photo-index mono">1/3</span>

  </figure>
  <p class="gallery-caption-fallback"></p>

  <div class="cols">
    <span class="stamp" style="--rot:6deg;">Doors Open</span>
    <p>The 46th Annual Meetings of the Boards of Governors of the IMF and World Bank Group ran October&nbsp;15&ndash;17, 1991, capping several days of related committee sessions. More than 10,000 delegates, central bankers, finance ministers, journalists and staff arrived in Bangkok for the event &mdash; early estimates had run as high as 12,000.</p>
    <div class="figure-box"><span class="fig-num mono">10,000+</span><span class="fig-label">Delegates, bankers and press in attendance</span></div>
    <p>For Thailand, the meetings were as much a debut as a duty: a chance to present a rapidly industrializing economy to the institutions that shaped global development finance, on infrastructure built specifically to make the case.</p>
    <p>When the gavel closed the meetings on October&nbsp;17, the Queen Sirikit National Convention Center remained standing as the most visible physical legacy of years of preparation that had reshaped a stretch of the city to meet a single week in October. The hall would host events for decades afterward, though a major renovation in 2019&ndash;2022 substantially rebuilt and expanded the original structure.</p>
    <p class="page-sources mono">Sources: <a href="https://documents1.worldbank.org/curated/en/178181468170972776/pdf/534280BR0board11Official0Use0Only10.pdf" target="_blank" rel="noopener">World Bank, 1991 Annual Meetings records</a> &middot; <a href="https://www.washingtonpost.com/archive/politics/1991/10/16/imf-conference-brings-10000-to-bangkok/8320c2ee-8ca0-463f-8588-99506fb7f493/" target="_blank" rel="noopener">The Washington Post, Oct. 16, 1991</a> &middot; <a href="https://en.wikipedia.org/wiki/Queen_Sirikit_National_Convention_Center" target="_blank" rel="noopener">Queen Sirikit National Convention Center (renovation dates)</a> &middot; Bank of Thailand archives</p>

  <div class="cols">
    <span class="stamp" style="--rot:6deg;">เปิดประตู</span>
    <p>การประชุมประจำปีครั้งที่ 46 ของคณะผู้ว่าการ IMF และกลุ่มธนาคารโลก จัดขึ้นระหว่างวันที่ 15&ndash;17 ตุลาคม พ.ศ. 2534 เป็นบทสรุปของการประชุมคณะกรรมการต่าง ๆ ที่จัดขึ้นก่อนหน้านั้นไม่กี่วัน ผู้แทน ผู้ว่าการธนาคารกลาง รัฐมนตรีคลัง นักข่าว และเจ้าหน้าที่กว่า 10,000 คน เดินทางมายังกรุงเทพฯ เพื่อร่วมงานนี้ ตัวเลขประมาณการก่อนหน้านี้เคยสูงถึง 12,000 คน</p>
    <div class="figure-box"><span class="fig-num mono">10,000+</span><span class="fig-label">ผู้แทน นักการธนาคาร และสื่อมวลชนที่เข้าร่วมงาน</span></div>
    <p>สำหรับประเทศไทย การประชุมครั้งนี้เป็นทั้งหน้าที่และการเปิดตัวสู่สายตาโลก เป็นโอกาสที่จะนำเสนอเศรษฐกิจที่กำลังก้าวสู่ความเป็นอุตสาหกรรมอย่างรวดเร็ว ต่อองค์กรที่กำหนดทิศทางการเงินเพื่อการพัฒนาระดับโลก บนโครงสร้างพื้นฐานที่สร้างขึ้นมาเพื่อพิสูจน์เรื่องนี้โดยเฉพาะ</p>
    <p>เมื่อค้อนปิดการประชุมลงในวันที่ 17 ตุลาคม ศูนย์การประชุมแห่งชาติสิริกิติ์ยังคงตั้งตระหง่านอยู่ ในฐานะมรดกทางกายภาพที่ชัดเจนที่สุดของการเตรียมงานอันยาวนาน ที่เปลี่ยนโฉมพื้นที่ส่วนหนึ่งของเมืองเพื่อรองรับเพียงหนึ่งสัปดาห์ในเดือนตุลาคม หอประชุมแห่งนี้เปิดใช้งานต่อเนื่องมาหลายทศวรรษ แม้จะผ่านการปรับปรุงครั้งใหญ่ในช่วง พ.ศ. 2562&ndash;2565 ซึ่งสร้างและขยายอาคารเดิมขึ้นใหม่อย่างมีนัยสำคัญ</p>
    <p class="page-sources mono">แหล่งข้อมูล: <a href="https://documents1.worldbank.org/curated/en/178181468170972776/pdf/534280BR0board11Official0Use0Only10.pdf" target="_blank" rel="noopener">World Bank, 1991 Annual Meetings records</a> &middot; <a href="https://www.washingtonpost.com/archive/politics/1991/10/16/imf-conference-brings-10000-to-bangkok/8320c2ee-8ca0-463f-8588-99506fb7f493/" target="_blank" rel="noopener">The Washington Post, Oct. 16, 1991</a> &middot; <a href="https://en.wikipedia.org/wiki/Queen_Sirikit_National_Convention_Center" target="_blank" rel="noopener">Queen Sirikit National Convention Center (renovation dates)</a> &middot; เอกสารจดหมายเหตุของธนาคารแห่งประเทศไทย</p>

  function initGalleries(root){
    root.querySelectorAll('.photo-gallery').forEach(function(fig){
      var key = fig.getAttribute('data-gallery');
      var photos = galleries[key];
      if(!photos) return;
      var idx = 0;
      var imgEl = fig.querySelector('.gallery-img');
      var indexEl = fig.querySelector('.photo-index');
      var captionEl = fig.querySelector('.pco-text');
      var fallbackEl = fig.parentElement.querySelector('.gallery-caption-fallback');
      function render(){
        var item = photos[idx];
        var hasPhoto = !!item.src;
        var thList = thCaptions[key];
        var caption = (currentLang === 'th' && thList && thList[idx]) ? thList[idx] : item.caption;
        fig.classList.toggle('showing-photo', hasPhoto);
        if(imgEl){
          if(hasPhoto){ imgEl.src = item.src; imgEl.alt = caption; }
          else { imgEl.removeAttribute('src'); imgEl.alt = ''; }
        }
        if(indexEl) indexEl.textContent = (idx+1) + '/' + photos.length;
        if(captionEl) captionEl.textContent = caption;
        if(fallbackEl) fallbackEl.textContent = caption;
      }
      render();
      function advance(){ idx = (idx + 1) % photos.length; render(); }
      fig.addEventListener('click', function(e){ e.stopPropagation(); advance(); });
      fig.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); advance(); }
      });
    });
  }

  function contentFor(id){
    var suffix = currentLang === 'th' ? '-th' : '';
    var tpl = document.getElementById('tpl-' + id + suffix) || document.getElementById('tpl-' + id);
    return tpl.content.cloneNode(true);
  }
  function fill(el, id){ el.innerHTML=''; el.appendChild(contentFor(id)); initGalleries(el); }

  function applyChromeLanguage(lang){
    document.querySelectorAll('[data-en]').forEach(function(el){
      var val = el.getAttribute('data-' + lang);
      if(val !== null) el.textContent = val;
    });
  }

  function setLanguage(lang){
    if(lang === currentLang) return;
    currentLang = lang;
    document.getElementById('app').setAttribute('data-lang', lang);
    document.querySelectorAll('[data-lang-btn]').forEach(function(btn){
      var isActive = btn.getAttribute('data-lang-btn') === lang;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
    applyChromeLanguage(lang);
    fill(overContent, current);
    fill(underContent, current);
  }

  fill(overContent, current);
  fill(underContent, current);

  function updateTabs(id){
    document.querySelectorAll('.tab').forEach(function(t){
      var isActive = t.getAttribute('data-goto') === id;
      t.classList.toggle('active', isActive);
      t.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
  }

  function goTo(id){
    if(busy || !document.getElementById('tpl-'+id)) return;
    if(id === current){ newspaperEl.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    var forward = order.indexOf(id) > order.indexOf(current);

    fill(underContent, id);
    newspaperEl.scrollIntoView({behavior:'smooth', block:'start'});

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion){
      fill(overContent, id);
      current = id;
      updateTabs(id);
      return;
    }

    busy = true;
    leafOver.classList.remove('flip-fwd','flip-back');
    void leafOver.offsetWidth;
    leafOver.style.transformOrigin = forward ? 'left center' : 'right center';
    leafOver.classList.add(forward ? 'flip-fwd' : 'flip-back');

    leafOver.addEventListener('animationend', function handler(){
      leafOver.removeEventListener('animationend', handler);
      leafOver.classList.remove('flip-fwd','flip-back');
      fill(overContent, id);
      current = id;
      busy = false;
      updateTabs(id);
    }, { once:true });
  }

  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-goto]');
    if(btn){ goTo(btn.getAttribute('data-goto')); return; }
    var langBtn = e.target.closest('[data-lang-btn]');
    if(langBtn) setLanguage(langBtn.getAttribute('data-lang-btn'));
  });

  function goNext(){ var i = order.indexOf(current); if(i < order.length - 1) goTo(order[i+1]); }
  function goPrev(){ var i = order.indexOf(current); if(i > 0) goTo(order[i-1]); }

  // Arrow-key navigation
  document.addEventListener('keydown', function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === 'ArrowRight'){ goNext(); }
    else if(e.key === 'ArrowLeft'){ goPrev(); }
  });

  // Click the left/right edge of the page to turn it
  var suppressClick = false;
  newspaperEl.addEventListener('click', function(e){
    if(suppressClick){ suppressClick = false; return; }
    if(busy) return;
    if(e.target.closest('[data-goto], .photo-gallery')) return;
    if(window.getSelection().toString().length > 0) return;
    var rect = leafOver.getBoundingClientRect();
    var pct = (e.clientX - rect.left) / rect.width;
    if(pct <= 0.15) goPrev();
    else if(pct >= 0.85) goNext();
  });

  // Drag / swipe to turn the page
  var dragStartX = null, dragStartY = null, dragActive = false;
  newspaperEl.addEventListener('pointerdown', function(e){
    if(busy) return;
    if(e.target.closest('[data-goto], .photo-gallery')) return;
    dragStartX = e.clientX; dragStartY = e.clientY; dragActive = true;
  });
  function endDrag(e){
    if(!dragActive) return;
    dragActive = false;
    if(window.getSelection().toString().length > 0) return;
    var dx = e.clientX - dragStartX;
    var dy = e.clientY - dragStartY;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
      suppressClick = true;
      setTimeout(function(){ suppressClick = false; }, 80);
      if(dx < 0) goNext(); else goPrev();
    }
  }
  newspaperEl.addEventListener('pointerup', endDrag);
  newspaperEl.addEventListener('pointercancel', function(){ dragActive = false; });
  newspaperEl.addEventListener('pointerleave', function(){ dragActive = false; });
</script>
